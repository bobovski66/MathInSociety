name: Build Chapter 9 Networks PDF
on:
  push:
    paths:
      - 'readings/Math107_Chapter_09_Networks.tex'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended
      - name: Compile Chapter 9 Networks
        working-directory: readings
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error Math107_Chapter_09_Networks.tex
          pdflatex -interaction=nonstopmode -halt-on-error Math107_Chapter_09_Networks.tex
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readings/Math107_Chapter_09_Networks.pdf
          git commit -m "Build Chapter 9 networks PDF" || echo "No PDF changes"
          git push
