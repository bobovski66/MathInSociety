name: Build Week 9 Binary and Octal PDF

on:
  push:
    branches: [main]
    paths:
      - "readings/Math107_Module09_Binary.tex"
      - ".github/workflows/build-module9-binary.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: math107-module9-binary-pdf
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out chapter source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile Week 9 illustrated PDF
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: readings
          root_file: Math107_Module09_Binary.tex
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Verify generated PDF
        run: test -s readings/Math107_Module09_Binary.pdf
      - name: Commit regenerated chapter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readings/Math107_Module09_Binary.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild Week 9 binary and octal PDF"
          git fetch origin main
          git rebase -X theirs origin/main
          git push origin HEAD:main
