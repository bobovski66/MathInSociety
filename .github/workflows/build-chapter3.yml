name: Build Math 107 Chapter 3

on:
  push:
    paths:
      - "readings/Math107_Chapter_03.tex"
      - ".github/workflows/build-chapter3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile Chapter 3
        uses: xu-cheng/latex-action@v4
        with:
          root_file: Math107_Chapter_03.tex
          working_directory: readings
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Commit compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readings/Math107_Chapter_03.pdf
          git diff --cached --quiet || git commit -m "Build updated Math 107 Chapter 3 PDF"
          git push
