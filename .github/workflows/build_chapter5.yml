name: Build Chapter 5 PDF

on:
  push:
    paths:
      - 'readings/Math107_Chapter_05.tex'
      - 'readings/Math107_Chapter_05_Printables.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended
      - name: Compile Chapter 5 and student printables
        working-directory: readings
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error Math107_Chapter_05.tex
          pdflatex -interaction=nonstopmode -halt-on-error Math107_Chapter_05.tex
          pdflatex -interaction=nonstopmode -halt-on-error Math107_Chapter_05_Printables.tex
          pdflatex -interaction=nonstopmode -halt-on-error Math107_Chapter_05_Printables.tex
      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add readings/Math107_Chapter_05.pdf readings/Math107_Chapter_05_Printables.pdf
          git diff --cached --quiet && exit 0
          git commit -m "Build revised Chapter 5 PDF"
          git push
