name: Build Math 107 Chapter 2
on:
  push:
    paths:
      - "readings/week2_reading.html"
      - "scripts/build_week2_chapter.py"
      - ".github/workflows/build-chapter2.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install HTML conversion dependency
        run: python -m pip install lxml
      - name: Regenerate Chapter 2 LaTeX from revised reading
        run: python scripts/build_week2_chapter.py
      - name: Compile Chapter 2 PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: Math107_Chapter_02.tex
          working_directory: readings
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Commit updated chapter source and PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readings/Math107_Chapter_02.tex readings/Math107_Chapter_02.pdf
          git diff --cached --quiet || git commit -m "Build edited Math 107 Chapter 2 PDF"
          git push
