name: Verify Math 107 labs and demos
on:
  push:
    paths:
      - "labs/**"
      - "demos/**"
      - "assets/week*/week*.js"
      - "scripts/activity_editorial.py"
      - "scripts/lab_copy_edits.json"
      - "scripts/verify_lab_focus.py"
      - "assets/lab-focus.css"
      - "assets/lab-submission.js"
      - "scripts/test_lab_html_export.js"
      - "scripts/build_week*_pages.py"
      - ".github/workflows/check-activities.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Python HTML parser
        run: python -m pip install lxml scipy
      - name: Verify focused lab layout and rebuild rules
        run: python scripts/verify_lab_focus.py
      - name: Test completed-HTML submission export
        run: |
          node --check assets/lab-submission.js
          node scripts/test_lab_html_export.js
      - name: Check pages and saved answer contracts
        run: |
          for w in $(seq 1 10); do
            python scripts/verify_week${w}.py
          done
      - name: Test mathematical models and page interactions
        run: |
          for w in $(seq 1 10); do
            node scripts/test_week${w}.js
          done
