<circle cx="343" cy="130" r="27" fill="#eef3e8" stroke="#536240" stroke-width="3"/><text x="343" y="136" text-anchor="middle" font-size="23" fill="#293329" font-weight="700">C</text><text x="343" y="179" text-anchor="middle" font-size="16" fill="#293329">Clinic</text>
