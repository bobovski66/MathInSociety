<path d="M40 350 H860" stroke="#d8ddcd" stroke-width="2"/>
<text x="40" y="384" font-size="17" font-family="Arial, sans-serif" fill="#17677a">Station–Clinic–Hospital: 2 links, 17 min. Via Library and Park: 3 links, 12 min.</text>
